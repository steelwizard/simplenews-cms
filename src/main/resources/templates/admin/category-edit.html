<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <link th:href="@{/css/style-dark.css}" rel="stylesheet" />
</head>
<body>
    <p th:if="${error}"><b>[[${error}]]</b></p>
    <form form method="post" th:action="@{/_private/admin/category-edit.html}" th:object="${category}" >
        <br>ID: <input id="id-input" th:field="*{id}" readonly><br>
        <label for="title-input">Title:</label>
        <input id="title-input" th:field="*{title}"/>
        <br>
        <label for="name-input">Name:</label>
        <input id="name-input" th:field="*{name}"/>
        <label for="parent-select">Parent: </label>
        <select id="parent-select" th:field="*{parent}">
            <option th:value="${null}">---root category---</option>
            <option th:each="current : ${categories}"
                    th:value="${current.id}"
                    th:text="${current.name}">
            </option>
        </select>
        <br>
        <label for="visible-input">Visible:</label>
        <input id="visible-input" type="checkbox" th:field="*{visible}"/>
        <br>
        Meta-Keywords: <input id="meta-keywords-input" type="text" th:field="*{metaKeywords}">
        Meta-Description: <input id="meta-description-input" type="text" th:field="*{metaDescription}">
        <br>
        <label for="type-select">Type: </label>
        <select id="type-select" th:field="*{type}">
            <option value="NEWS">NEWS</option>
            <option value="REVIEW">REVIEW</option>
            <option value="DOWNLOAD">DOWNLOAD</option>
        </select>
        <span id="review-type-fields">
            <label for="review-type-select">Review type: </label>
            <select id="review-type-select" th:field="*{reviewType}">
                <option th:value="${null}">---none---</option>
                <option th:each="rt : ${reviewTypes}" th:value="${rt.id}" th:text="${rt.title}"></option>
            </select>
            <span th:if="${reviewTypes.isEmpty()}">(create one under <a th:href="@{/_private/admin/review-type-overview.html}">Reviews</a> first)</span>
        </span>
        <br>
        [&nbsp;
        <button type="submit">
        Save
        </button>
        &nbsp;|&nbsp;
        <a th:href="@{/_private/admin/category-overview.html}">
            <button type="button">
                Back</button>
        </a>&nbsp;]
        <br><br>
        <a style="color:red" th:href="@{category-delete.html?id={id}(id=${category.id})}">Delete</a>
    </form>
    <script>
        (function () {
            var select = document.getElementById('type-select');
            var review = document.getElementById('review-type-fields');
            function update() {
                if (review) review.style.display = select.value === 'REVIEW' ? '' : 'none';
            }
            select.addEventListener('change', update);
            update();
        })();
    </script>
</body>
</html>
