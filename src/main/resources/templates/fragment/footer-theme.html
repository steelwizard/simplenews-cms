<footer th:fragment="footer-theme" class="theme-footer">
    <span>Theme:</span>
    <button class="theme-btn" data-theme="default"   onclick="setTheme('default')">Default</button>
    <button class="theme-btn" data-theme="dark"      onclick="setTheme('dark')">Dark</button>
    <button class="theme-btn" data-theme="solarized" onclick="setTheme('solarized')">Solarized</button>
    <button class="theme-btn" data-theme="terminal"  onclick="setTheme('terminal')">Terminal</button>
</footer>
