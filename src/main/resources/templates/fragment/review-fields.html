<dl th:fragment="review-fields(fields)" class="review-fields" th:if="${fields != null}">
    <th:block th:each="f : ${fields}">
        <dt>[[${f.label}]]</dt>
        <dd>
            <a th:if="${f.href != null and f.external}" th:href="${f.href}" rel="nofollow noopener" target="_blank">[[${f.value}]]</a>
            <a th:if="${f.href != null and !f.external}" th:href="@{${f.href}}">[[${f.value}]]</a>
            <span th:if="${f.href == null}">[[${f.value}]]</span>
        </dd>
    </th:block>
</dl>
