# Loaded with default Spring config; merged with optional file:/opt/cms/application.properties from Docker.
# Ensures tables exist when Postgres was initialized without docker-entrypoint scripts (sql/news-init.sql).
spring.jpa.hibernate.ddl-auto=update

# File Sizes (Spring Boot 4.0.0–4.0.3 Tomcat default max-part-count is 10; a post form has more parts than that)
spring.servlet.multipart.max-file-size=4000MB
spring.servlet.multipart.max-request-size=4000MB
server.tomcat.max-http-form-post-size=4000MB
server.tomcat.max-swallow-size=4000MB
server.tomcat.max-part-count=200
server.tomcat.max-part-header-size=16KB
