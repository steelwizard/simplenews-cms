services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: cms
    volumes:
      - ./_data/cms/:/opt/cms/
      - ./application.properties:/opt/cms/application.properties
    environment:
      # Import optional host file over classpath defaults (do not use spring.config.location — it replaces classpath config and drops packaged defaults).
      - SPRING_CONFIG_IMPORT=optional:file:/opt/cms/application.properties
    expose:
      - "8080"
    restart: always
    networks:
      - cms
  varnish:
    image: varnish:9.1
    depends_on:
      - web
      - forum
    ports:
      - "8080:80"
    environment:
      VARNISH_SIZE: 256M
    ulimits:
      memlock:
        soft: -1
        hard: -1
    tmpfs:
      - /var/lib/varnish/varnishd:exec
    volumes:
      - ./docker/varnish/default.vcl:/etc/varnish/default.vcl:ro
    # Passed uploads can be large; the default body timeouts are too short for that.
    command:
      - "-p"
      - "first_byte_timeout=600"
      - "-p"
      - "between_bytes_timeout=600"
      - "-p"
      - "send_timeout=600"
    restart: always
    networks:
      - cms
  data:
      image: "postgres:latest"
      expose:
        - 5432
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: news

      volumes:
        - ./_data/postgres/:/var/lib/postgresql/
        - ./docker/postgres/create-phpbb-db.sql:/docker-entrypoint-initdb.d/00-phpbb.sql
        - ./sql/news-init.sql:/docker-entrypoint-initdb.d/init.sql
      restart: always
      networks:
        - cms
  forum:
    build:
      context: ./docker/phpbb
    image: simplenews-phpbb
    depends_on:
      - data
    expose:
      - "80"
    environment:
      PHPBB_DBHOST: data
      PHPBB_DBPORT: "5432"
      PHPBB_DBUSER: postgres
      PHPBB_DBPASS: postgres
      PHPBB_DBNAME: phpbb
      PHPBB_ADMIN_NAME: admin
      PHPBB_ADMIN_PASSWORD: adminadmin
      PHPBB_ADMIN_EMAIL: admin@example.com
      SIMPLENEWS_API_KEY: dev-api-key
      SIMPLENEWS_WEBHOOK_KEY: dev-webhook-key
      SIMPLENEWS_WEBHOOK_URL: http://web:8080
      SIMPLENEWS_BOT_USERNAME: simplenews
    volumes:
      - ./docker/phpbb/ext/simplenews:/opt/phpbb/ext/simplenews
      - ./_data/phpbb:/var/phpbb-config
    restart: always
    networks:
      - cms

networks:
    cms:
      name: cms