server.servlet.session.cookie.name = SESSION
#server.error.whitelabel.enabled=false

# Database
spring.sql.init.platform=postgres
#spring.datasource.platform=postgres
#spring.datasource.url=jdbc:postgresql://localhost:5432/news
spring.datasource.url=jdbc:postgresql://simplenews-cms-data-1:5432/news
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.properties.hibernate.default_schema=public

# Data paths
#upload.file.basePath = A:\\Temp\\cms\\
upload.file.basePath = /opt/cms

# File Sizes
spring.servlet.multipart.max-file-size=4000MB
spring.servlet.multipart.max-request-size=4000MB
server.tomcat.max-http-form-post-size=4000MB

# Logging and monitoring
#logging.level.org.springframework.cache=TRACE
#logging.level.org.springframework.security=DEBUG
management.endpoints.web.exposure.include=caches
management.endpoint.info.enabled=true

# Cache
spring.cache.cache-names=news,newsLatest,siteSetting,category,rootCategory,categoryDto
spring.cache.caffeine.spec=maximumSize=250,expireAfterWrite=15m