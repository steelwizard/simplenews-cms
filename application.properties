server.servlet.session.cookie.name = SESSION
#server.error.whitelabel.enabled=false

# Database
spring.sql.init.platform=postgres
#spring.datasource.platform=postgres
#spring.datasource.url=jdbc:postgresql://localhost:5432/news
spring.datasource.url=jdbc:postgresql://simplenews-cms-data-1:5432/news
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.properties.hibernate.default_schema=public
# Create/update tables from entities when the DB volume was initialized without docker-entrypoint scripts (see sql/news-init.sql).
spring.jpa.hibernate.ddl-auto=update

# Data paths
#cms.data.path = A:\\Temp\\cms\\
cms.data.path = /opt/cms

# File Sizes
spring.servlet.multipart.max-file-size=4000MB
spring.servlet.multipart.max-request-size=4000MB
server.tomcat.max-http-form-post-size=4000MB
server.tomcat.max-swallow-size=4000MB
# Spring Boot 4.0.0–4.0.3 default is 10 parts; each form field is a part, so a post save 413s even for a tiny file.
server.tomcat.max-part-count=200
server.tomcat.max-part-header-size=16KB

# Logging and monitoring
#logging.level.org.springframework.cache=TRACE
#logging.level.org.springframework.security=DEBUG
management.endpoints.web.exposure.include=caches
management.endpoint.info.enabled=true

# phpBB discussion topics. The forum container is "forum" on the compose network.
# Set cms.phpbb.enabled=true after the one-time forum setup in the README.
cms.phpbb.enabled=true
cms.phpbb.base-url=http://localhost:8080/forum
cms.phpbb.api-url=http://forum/forum/app.php/simplenews
cms.phpbb.api-key=dev-api-key
cms.phpbb.webhook-key=dev-webhook-key
cms.phpbb.forum-id=2
cms.phpbb.site-url=http://localhost:8080

# Cache
spring.cache.cache-names=news,newsLatest,siteSetting,category,rootCategory,categoryDto,pages,navigation
spring.cache.caffeine.spec=maximumSize=250,expireAfterWrite=15m